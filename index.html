<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><title>ระบบเสนอความต้องการพัสดุ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/app.css">

<div id="loading-line" aria-hidden="true"></div><div id="login" class="login-wrap"><form id="login-form" class="login-card"><div class="brandmark">พัสดุ</div><h1>ระบบเสนอความต้องการพัสดุ</h1><p id="org-name"></p><label>ชื่อผู้ใช้<input name="username" autocomplete="username" required></label><label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">เข้าสู่ระบบ</button><button class="plain" type="button" id="public-btn">ดูภาพรวมแบบไม่เข้าสู่ระบบ</button><p class="muted" id="login-info"></p></form></div>
<div id="workspace" class="workspace hidden"><aside id="sidebar"><div class="side-head"><div class="brandmark">พัสดุ</div><button id="close-menu" class="icon" aria-label="ปิดเมนู">×</button></div><p id="identity"></p><nav id="menu"></nav><div class="side-foot"><p id="timing">ใช้เวลา – วิ</p><button id="logout" class="plain">ออกจากระบบ</button></div></aside><div id="content-column"><header class="topbar"><button id="toggle-menu" class="icon" aria-label="เปิดหรือปิดเมนู">☰</button><strong id="page-title">แดชบอร์ด</strong><button class="plain" id="refresh">โหลดข้อมูลใหม่</button></header><main id="view" aria-live="polite"></main></div></div>
